[pytest]
markers =
    add: tests for adding data
    select: tests for selecting data
    update: tests for updating data
    delete: tests for deleting data
    info: test for output information


# Disable colors in captured logs for Allure
log_auto_indent = false
addopts = -v --headed --tracing on

# 1. Увімкніть log_cli (поставивши 1 або true)
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 2. Логування у файл
log_file = pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 3. Формат для перехоплених логів (те, що іде в Allure attachments)
log_level = INFO
log_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning


# 4. Маски для пошуку тестів
;python_files = *_t.py
;python_classes = First*
;python_functions = tc_*